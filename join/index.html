<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src wss://nolog-server.onrender.com; base-uri 'none'; form-action 'none'">
<title>NOLOG — 招待</title>
<link rel="icon" href="data:,">
<!--
  NOLOG 受け取りページ（封書）
  - 招待コードは URL の「#」以降。ブラウザはこの部分をサーバーへ送らないので、配信サーバーのログにも残らない。
  - 「アプリで受け取る」: nolog://join/<code> でアプリを開く。
  - 「ブラウザで受け取る」: このページの中で鍵を作り、中継サーバーと直接つないで秘密を一度だけ受け取る。
      鍵・本文はこのページのメモリにだけ置き、保存しない。読み終えたら消して相手にも知らせる。
  - 暗号: tweetnacl（同梱。外部からは何も読み込まない。CSP で接続先を中継サーバーに限定）
-->
<style>
  :root{--paper:#F6F3EC;--card:#FBF9F4;--ink:#141412;--mute:#7A766C;--faint:#A29D91;--hair:rgba(20,20,18,0.10);--gold:#A88D5B;--gold-ink:#8A6E3F;--wax:#1A1917;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--paper);color:var(--ink);}
  body{-webkit-font-smoothing:antialiased;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;}
  .serif{font-family:"Hiragino Mincho ProN","Yu Mincho","Times New Roman",serif;}
  .wrap{max-width:420px;margin:0 auto;min-height:100vh;padding:72px 32px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;}
  .mark{font-size:20px;letter-spacing:12px;padding-left:12px;text-align:center;}
  .sub{font-size:9px;letter-spacing:6px;padding-left:6px;text-align:center;color:var(--gold);margin-top:10px;}
  .env{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin-top:56px;background:var(--card);border:1px solid var(--hair);border-radius:4px;padding:44px 28px 36px;text-align:center;box-shadow:0 1px 0 rgba(20,20,18,.03),0 18px 40px -24px rgba(20,20,18,.25);position:relative;}
  .env::before{content:"";position:absolute;inset:10px;border:1px solid var(--hair);border-radius:2px;pointer-events:none;}
  .env.tall{padding:56px 28px;}
  .wax{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3834,#141412 70%);margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -6px rgba(0,0,0,.45);position:relative;z-index:1;}
  .wax span{color:#C9B68F;font-size:16px;letter-spacing:1px;}
  button.wax{border:0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  .wax.pressing{transform:scale(.94);transition:transform .25s ease;}
  .wax.dim{opacity:.35;}
  .lead{font-size:18px;line-height:1.9;margin-top:28px;letter-spacing:1px;}
  .lead small{display:block;font-size:12px;color:var(--mute);margin-top:10px;letter-spacing:1px;}
  .opts{margin-top:28px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;}
  .btn{display:block;width:100%;text-align:center;padding:17px;border-radius:999px;font-size:14px;letter-spacing:3px;text-decoration:none;font-family:inherit;cursor:pointer;}
  .btn.dark{background:var(--wax);color:#F6F3EC;border:0;}
  .btn.line{background:transparent;border:1px solid rgba(20,20,18,.22);color:var(--ink);}
  .note{font-size:11px;color:var(--mute);line-height:1.9;margin-top:14px;text-align:center;}
  .note b{color:var(--gold-ink);font-weight:500;}
  .hold{font-size:11px;letter-spacing:4px;color:var(--gold);margin-top:22px;padding-left:4px;}
  .status{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;color:var(--mute);letter-spacing:1px;margin-top:22px;}
  .spin{width:12px;height:12px;border:1.5px solid var(--faint);border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite;}
  @keyframes r{to{transform:rotate(360deg)}}
  .secret{font-size:22px;line-height:1.8;letter-spacing:1px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:none;user-select:none;}
  .rule{width:28px;height:1px;background:var(--gold);margin:22px auto;opacity:.6;}
  .t{font-size:20px;letter-spacing:2px;}
  .d{font-size:12px;color:var(--mute);line-height:2.2;margin-top:16px;letter-spacing:.5px;}
  .store{display:block;text-align:center;font-size:12px;color:var(--mute);letter-spacing:1px;margin-top:22px;text-decoration:none;}
  .foot{margin-top:auto;padding-top:36px;font-size:10px;letter-spacing:1px;color:var(--faint);text-align:center;line-height:2;}
  .foot a{color:inherit;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){.spin{animation:none}.wax.pressing{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite">
  <div class="mark serif">NOLOG</div>
  <div class="sub">LEAVE NO TRACE</div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</main>
<script src="nacl-fast.min.js"></script>
<script src="join.js"></script>
</body>
</html>
