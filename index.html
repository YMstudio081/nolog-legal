<!DOCTYPE html>
<html lang="ja">
<head>

<title>NOLOG</title>
<style>

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;}

  .brand{font-size:40px;font-weight:500;letter-spacing:6px;margin-bottom:8px;}
  .sub{color:var(--muted);font-size:14px;letter-spacing:1px;margin-bottom:48px;}
  a.link{display:block;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:18px;margin:12px 0;color:var(--text);text-decoration:none;font-size:15px;letter-spacing:0.5px;}
  a.link:hover{border-color:var(--accent);}
  footer{color:var(--faint);font-size:13px;margin-top:48px;}
</style>
</head>
